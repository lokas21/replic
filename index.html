<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YC3 — Étude</title>

  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>

  <style>

    .jspsych-content {
      max-width: 1000px; color: #fff;

    /* ── Buttons ── */

      border: 2px solid #555; font-size: 1em;
      padding: 6px 10px; border-radius: 2px;

    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;

    }
    input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px;
      background: red; border-radius: 50%; border: none; cursor: pointer;
    }

    /* ── Misc ── */

    .timer-yc3  { color: #f55; font-size: 1.1em; font-weight: bold; }
    .hint-text  { color: #aaa; font-size: 0.85em; margin-top: 8px; }
    .green-lbl  { color: #0f0; }
    .red-lbl    { color: #f44; }
    .ticks-row  {
      display: flex; justify-content: space-between;
      width: 85%; margin: 0 auto 4px; color: #aaa; font-size: 0.82em;
    }


    /* ── Module affect / DAT / sit (YC5-inspired) ── */
    .module-container {
      color: #fff; max-width: 820px; margin: 0 auto; padding: 10px 20px;
    }
    .module-header {
      font-size: 1.1em; font-weight: bold; margin-bottom: 36px;
      line-height: 1.9; text-align: center;
    }

    .module-container.affect-module { font-size: 0.82em; }
    .affect-row {
      display: flex; align-items: center;
      margin-bottom: 18px; gap: 20px;
    }
    .affect-label {
      font-size: 1em; font-weight: bold;
      width: 210px; flex-shrink: 0; text-align: right;
    }
    .affect-slider-wrap { flex: 1; position: relative; }
    .affect-slider-wrap input[type="range"] {
      width: 100%; margin: 6px 0;
      accent-color: #aaa;
    }

    /* DAT vertical rows */
    .dat-row-v {
      display: flex; align-items: center;
      margin-bottom: 56px; gap: 44px;
    }
    .dat-img-v {
      width: 380px; height: 300px; object-fit: contain;
      border: 1px solid #666; background: #1a1a1a; flex-shrink: 0;
    }
    .dat-slider-v { flex: 1; }
    .dat-slider-v input[type="range"] {
      width: 100%; margin: 12px 0; accent-color: #aaa;
    }

    /* Sit controle */
    .sit-row-v { margin-bottom: 44px; }
    .sit-question-v {
      font-size: 1.15em; color: #fff; margin-bottom: 50px; line-height: 2.0;
    }
    .sit-slider-v input[type="range"] {
      width: 100%; margin: 14px 0; accent-color: #aaa;
    }

    /* Tick labels */
    .tick-labels {
      display: flex; justify-content: space-between;
      font-size: 0.9em; color: #bbb; margin-top: 4px;
    }

    /* Error */
    .form-error {
      color: #f66; font-size: 0.9em; margin-top: 10px; display: none;
    }

    /* Override jspsych survey button */
    #jspsych-survey-html-form-next {
      background: #444; color: #fff; border: 1px solid #888;
      padding: 12px 44px; font-size: 1.1em; cursor: pointer;
      border-radius: 4px; margin-top: 28px;

    #jspsych-survey-html-form-next:hover { background: #666; }

  </style>
</head>
<body>


<script>
/* ═══════════════════════════════════════════════════════════════════
   YC3  —  jsPsych 7  —  URL unique, allocation automatique
   ═══════════════════════════════════════════════════════════════════

   Allocation aléatoire stratifiée — 100 % dans le script, aucun serveur.
   ═══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────
   FICHIERS à placer à la racine du repo GitHub
   ─────────────────────────────────────────────────────────────────
   sequences_Frustration.csv   — colonne "sequence"
   sequences_Controle.csv      — colonne "sequence"
   welcome_1.png / welcome_2.png
   debrief_1.png / debrief_2.png / debrief_3.png
   dat_images/ApT1.png, ApT2.png, AvR1.png, AvR2.png
   ───────────────────────────────────────────────────────────────── */

// ────────────────────────────────────────────────────────────────
//  ÉTAT GLOBAL
// ────────────────────────────────────────────────────────────────
let condition_groupe = null;
let condition_emo    = null;
let ordre_condition  = null;
let sequences        = [];

let jsPsych;  // déclaré globalement pour être accessible depuis les trial builders
const DATA      = {};
const ANGER_RTs     = [];
const ANGER_RTs_BIS = [];

// ────────────────────────────────────────────────────────────────
//  UTILITAIRES
// ────────────────────────────────────────────────────────────────
function slug(s) {
  if (!s) return 'na';
  return s.toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'na';
}

function capture(key, val) {
  DATA[key] = (val === null || val === undefined || val === '') ? 'NA' : val;
}

function meanMs(arr) {
  if (!arr.length) return 'NA';
  return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseCSV(text) {
  // Strip BOM if present
  text = text.replace(/^\uFEFF/, '');
  const lines = text.trim().split(/\r?\n/);
  // Auto-detect separator: semicolon or comma
  const sep = lines[0].includes(';') ? ';' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = line.split(sep).map(v => v.trim().replace(/^"|"$/g, ''));
    const obj  = {};
    headers.forEach((h, i) => { obj[h] = vals[i] ?? ''; });
    return obj;
  });
}

// ── Participant ID ───────────────────────────────────────────────
(function() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const pid = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  capture('participant_id', pid);
})();

// ── Sauvegarde des données (CSV local) ─────────────────────────────
function downloadCSV() {
  capture('anger_rt_enter_ms',     meanMs(ANGER_RTs));
  capture('anger_rt_enter_ms_bis', meanMs(ANGER_RTs_BIS));
  const keys = Object.keys(DATA);
  const csv  = [
    keys.join(','),
    keys.map(k => `"${String(DATA[k]).replace(/"/g,'""')}"`).join(',')
  ].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `YC3_${DATA.participant_id || 'anon'}_participants.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}



// ────────────────────────────────────────────────────────────────
//  CONSTANTES
// ────────────────────────────────────────────────────────────────
const EMOTION_ITEMS = [
  'Je me sens contrarié(e)', 'Je me sens irritable', 'Je me sens en colère',
  'Je me sens triste',       'Je me sens morose',    'Je me sens déprimé(e)',
  'Je me sens joyeux(se)',   'Je me sens heureux(se)', 'Je me sens détendu(e)'
];

const DAT_IMAGES = [
  'dat_images/ApT1.png', 'dat_images/ApT2.png',
  'dat_images/AvR1.png', 'dat_images/AvR2.png'
];

// ────────────────────────────────────────────────────────────────
//  HELPER : injecter du contenu dans le display jsPsych
// ────────────────────────────────────────────────────────────────
function setContent(html) {
  const el = document.querySelector('.jspsych-content');
  if (el) el.innerHTML =
    `<div style="color:#fff;font-family:Arial,sans-serif;text-align:center;max-width:900px;margin:auto;">${html}</div>`;
}

// ════════════════════════════════════════════════════════════════
//  BUILDERS DE TRIALS
// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════
//  AFFECT — tous les 9 items sur un seul écran (stacked)
// ════════════════════════════════════════════════════════════════
function makeAffectAllTrial(pEmo, pRate, _unused) {
  const color = '#fff';  // même couleur pour tous les items

  function buildHtml() {
    const orderedItems = shuffle(EMOTION_ITEMS);  // ordre aléatoire à chaque fois
    const rows = orderedItems.map(emo => {
      const name = slug(emo);
      return `
        <div class="affect-row">
          <div class="affect-label" style="color:${color};">${emo}</div>
          <div class="affect-slider-wrap">
            <input type="range" name="${name}"
              class="affect-slider required-affect"
              min="0" max="100" step="1" value="50">
            <div class="tick-labels">
              <span>0<br><small>Pas du tout</small></span>
              <span>50</span>
              <span>100<br><small>Extrêmement</small></span>
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="module-container affect-module">
        <p class="module-header">
          À quelle intensité ressentez-vous à ce moment précis les émotions suivantes ?
        </p>
        ${rows}
        <p class="form-error" id="affect-err">
          Merci de déplacer tous les curseurs avant de continuer.
        </p>
      </div>`;
  }

  return {
    type: jsPsychSurveyHtmlForm,
    html: buildHtml,
    button_label: 'Continuer',
    on_load() {
      const moved = new Set();
      document.querySelectorAll('.required-affect').forEach(s => {
        s.addEventListener('input', () => moved.add(s.name));
      });
      const btn = document.getElementById('jspsych-survey-html-form-next');
      if (btn) btn.addEventListener('click', function(e) {
        if (moved.size < EMOTION_ITEMS.length) {
          e.preventDefault(); e.stopImmediatePropagation();
          document.getElementById('affect-err').style.display = 'block';
        }
      }, true);
    },
    on_finish(data) {
      const resp = data.response || {};
      EMOTION_ITEMS.forEach(emo => {
        const name = slug(emo);
        const val = resp[name];
        DATA[`${pEmo}_${name}`]  = emo;
        DATA[`${pRate}_${name}`] = (val !== undefined && val !== '') ? parseFloat(val) : 'NA';
      });
    }
  };
}

// ════════════════════════════════════════════════════════════════
//  DAT — 4 images empilées verticalement
// ════════════════════════════════════════════════════════════════
function makeDatAllTrial(pImg, pRate) {
  let _imgs = [];

  function buildHtml() {
    // Toujours 1 AvR + 1 ApT, tirés aléatoirement dans leur catégorie
    const AvRs = DAT_IMAGES.filter(p => p.includes('AvR'));
    const ApTs = DAT_IMAGES.filter(p => p.includes('ApT'));
    const pickedAvR = AvRs[Math.floor(Math.random() * AvRs.length)];
    const pickedApT = ApTs[Math.floor(Math.random() * ApTs.length)];
    _imgs = shuffle([pickedAvR, pickedApT]);
    const rows = _imgs.map(imgPath => {
      const base = imgPath.split('/').pop().replace(/\.[^.]+$/, '');
      const name = slug(base);
      return `
        <div class="dat-row-v">
          <img src="${imgPath}" class="dat-img-v" alt="${base}">
          <div class="dat-slider-v">
            <input type="range" name="${name}"
              class="required-dat"
              min="1" max="5" step="0.1" value="3">
            <div class="tick-labels">
              <span>1<br><small>Pas du tout</small></span>
              <span>3</span>
              <span>5<br><small>Tout à fait</small></span>
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="module-container">
        <p class="module-header">
          Regardez ces dessins. À quel point chacun correspond à ce que vous auriez envie de faire maintenant ?
        </p>
        ${rows}
        <p class="form-error" id="dat-err">
          Merci de déplacer tous les curseurs avant de continuer.
        </p>
      </div>`;
  }

  return {
    type: jsPsychSurveyHtmlForm,
    html: buildHtml,
    button_label: 'Continuer',
    on_load() {
      const moved = new Set();
      document.querySelectorAll('.required-dat').forEach(s => {
        s.addEventListener('input', () => moved.add(s.name));
      });
      const btn = document.getElementById('jspsych-survey-html-form-next');
      if (btn) btn.addEventListener('click', function(e) {
        if (moved.size < 2) {
          e.preventDefault(); e.stopImmediatePropagation();
          document.getElementById('dat-err').style.display = 'block';
        }
      }, true);
    },
    on_finish(data) {
      const resp = data.response || {};
      _imgs.forEach(imgPath => {
        const base = imgPath.split('/').pop().replace(/\.[^.]+$/, '');
        const name = slug(base);
        DATA[`${pImg}_${name}`]  = base;
        DATA[`${pRate}_${name}`] = parseFloat(resp[name]) || 'NA';
      });
    }
  };
}

// ════════════════════════════════════════════════════════════════
//  SIT_CONTROLE — contrôle perçu sur la situation (CPM)
// ════════════════════════════════════════════════════════════════
function makeSitControleTrial(prefix) {
  return {
    type: jsPsychSurveyHtmlForm,
    html: `
      <div class="module-container">
        <p class="module-header">
          En pensant à ce que vous venez de ressentir…
        </p>
        <div class="sit-row-v">
          <p class="sit-question-v">
            « Dans quelle mesure vous sentez-vous en contrôle de cette expérience en ce moment ? »
          </p>
          <div class="sit-slider-v">
            <input type="range" name="sit_controle"
              class="required-sit"
              min="0" max="100" step="0.1" value="50">
            <div class="tick-labels">
              <span>Aucun contrôle</span>
              <span>Contrôle total</span>
            </div>
          </div>
        </div>
        <p class="form-error" id="sit-err">
          Merci de déplacer le curseur avant de continuer.
        </p>
      </div>`,
    button_label: 'Continuer',
    on_load() {
      let moved = false;
      document.querySelector('.required-sit').addEventListener('input', () => { moved = true; });
      const btn = document.getElementById('jspsych-survey-html-form-next');
      if (btn) btn.addEventListener('click', function(e) {
        if (!moved) {
          e.preventDefault(); e.stopImmediatePropagation();
          document.getElementById('sit-err').style.display = 'block';
        }
      }, true);
    },
    on_finish(data) {
      const val = parseFloat((data.response || {}).sit_controle);
      capture(`${prefix}_sit_controle`, isNaN(val) ? 'NA' : val);
    }
  };
}

// ── Consigne affect (8 s) ─────────────────────────────────────
const aff_consigne = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<p style="color:#fff;font-size:1.1em;">Nous nous intéressons maintenant à vos ressentis.<br><br>Répondez aux questions suivantes.</p>',
  choices: 'NO_KEYS',
  trial_duration: 8000
};

// ── Tâche de suites de nombres ────────────────────────────────
let _angerTrialIndex = 0;  // global counter reset at each block

function makeAngerTrial(sequence, rtList) {
  const _myIndex = _angerTrialIndex++;  // capture index for this trial
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      const t0 = performance.now();
      let timerInterval = null;

      const timerHTML = (condition_groupe === 'Frustration')
        ? `<p id="yc3_timer" class="timer-yc3" style="margin-bottom:10px;"></p>` : '';

      setContent(`
        ${timerHTML}
        <p style="font-size:1.3em;letter-spacing:3px;margin:20px 0;">${sequence}</p>
        <input type="text" id="yc3_ans" maxlength="4" autocomplete="off"
          style="width:250px;font-size:1.4em;text-align:center;" placeholder="Réponse">
        <p id="yc3_feedback" style="display:none;font-size:1.1em;font-weight:bold;margin-top:14px;"></p>
        <p class="hint-text" style="margin-top:12px;">Appuyez sur <strong>ENTRÉE</strong> pour continuer.</p>
      `);
      document.getElementById('yc3_ans').focus();

      function finish() {
        clearInterval(timerInterval);
        document.removeEventListener('keydown', onKey);
        rtList.push(Math.round(performance.now() - t0));
        if (condition_groupe === 'Frustration') {
          const input = document.getElementById('yc3_ans');
          const givenVal = input ? input.value.trim() : '';
          // Première séquence : réponse 23 = correcte, sinon toujours incorrecte
          const isCorrect = (_myIndex === 0 && givenVal === '23');
          if (input) {
            input.disabled = true;
            input.style.borderColor = isCorrect ? '#4f4' : '#f55';
          }
          const fb = document.getElementById('yc3_feedback');
          if (fb) {
            fb.style.display = 'block';
            fb.style.color   = isCorrect ? '#4f4' : '#f55';
            fb.textContent   = isCorrect ? '✅ Réponse correcte' : '❌ Réponse incorrecte';
          }
          setTimeout(() => jsPsych.finishTrial({}), 1200);
        } else {
          jsPsych.finishTrial({});
        }
      }

      if (condition_groupe === 'Frustration') {
        const deadline = performance.now() + 30000;
        timerInterval = setInterval(() => {
          const rem = Math.max(0, (deadline - performance.now()) / 1000);
          const el = document.getElementById('yc3_timer');
          if (el) el.textContent = `Temps restant : ${rem.toFixed(1)} s`;
          if (rem <= 0) finish();
        }, 100);
      }

      function onKey(e) {
        if (e.key !== 'Enter') return;
        const val = (document.getElementById('yc3_ans') || {}).value?.trim() ?? '';
        if (/^\d{1,4}$/.test(val)) finish();
      }
      document.addEventListener('keydown', onKey);
    }
  };
}

// ── Induction émotionnelle (120 s) ───────────────────────────
function makeEmoInduction() {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      const consigne = (condition_emo === 'triste')
        ? 'Veuillez décrire un souvenir <strong>TRISTE</strong>, récent, ayant provoqué des émotions fortes. Soyez aussi précis et détaillé que possible. Vous avez 2 minutes pour l\'écrire ci-dessous. <em>(Vous passerez à la tâche suivante automatiquement à la fin des 2 minutes.)</em>'
        : 'Veuillez décrire une situation <strong>NEUTRE</strong> de votre vie quotidienne. Par exemple, détaillez la couleur de vos vêtements. Vous avez 2 minutes pour écrire votre description ci-dessous. <em>(Vous passerez automatiquement à la tâche suivante à la fin du temps imparti.)</em>';

      setContent(`
        <p style="font-size:0.9em;color:#ddd;max-width:750px;margin:0 auto 12px;line-height:1.6;">${consigne}</p>
        <textarea id="yc3_emo_text" rows="10"
          style="width:86%;resize:none;font-size:1em;padding:8px;background:#2a2a2a;color:#fff;border:2px solid #666;"></textarea>
      `);
      document.getElementById('yc3_emo_text').focus();

      // Timer silencieux — pas affiché, passage automatique après 120 s
      const t0 = performance.now();
      const iv = setInterval(() => {
        const rem = 120 - (performance.now() - t0) / 1000;
        if (rem <= 0) { clearInterval(iv); jsPsych.finishTrial({}); }
      }, 500);
    }
  };
}

// ── Ecran clavier libre (ENTER pour continuer) ────────────────
function enterScreen(htmlContent) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      setContent(htmlContent);
      function onKey(e) {
        if (e.key === 'Enter') {
          document.removeEventListener('keydown', onKey);
          jsPsych.finishTrial({});
        }
      }
      document.addEventListener('keydown', onKey);
    }
  };
}

// ════════════════════════════════════════════════════════════════
//  POINT D'ENTRÉE PRINCIPAL  (async pour fetch allocation + CSV)
// ════════════════════════════════════════════════════════════════
async function runExperiment() {

  // ── 1. ALLOCATION ALÉATOIRE STRATIFIÉE (100 % dans le script) ─────
  //
  // Les 8 cellules du plan 2×2×2 sont représentées dans ALLOCATION_TABLE.
  // La table est d'abord mélangée (Fisher-Yates sur le seed timestamp),
  // puis un index est tiré au hasard parmi toutes les cellules.
  // Sur N=80, chaque cellule reçoit ~10 participants en espérance.
  // ─────────────────────────────────────────────────────────────────────
  const ALLOCATION_TABLE = [
    // 25 répétitions × 8 cellules = 200 entrées
    ...Array(25).fill([
      { cg: 'Frustration', ce: 'triste',  oc: 'colere_dabord'     },
      { cg: 'Frustration', ce: 'triste',  oc: 'tristesse_dabord'  },
      { cg: 'Frustration', ce: 'neutre',  oc: 'colere_dabord'     },
      { cg: 'Frustration', ce: 'neutre',  oc: 'tristesse_dabord'  },
      { cg: 'Controle',    ce: 'triste',  oc: 'colere_dabord'     },
      { cg: 'Controle',    ce: 'triste',  oc: 'tristesse_dabord'  },
      { cg: 'Controle',    ce: 'neutre',  oc: 'colere_dabord'     },
      { cg: 'Controle',    ce: 'neutre',  oc: 'tristesse_dabord'  },
    ]).flat()
  ];

  // Tirage aléatoire dans la table complète (chaque appel est indépendant)
  const picked = ALLOCATION_TABLE[Math.floor(Math.random() * ALLOCATION_TABLE.length)];
  condition_groupe = picked.cg;
  condition_emo    = picked.ce;
  ordre_condition  = picked.oc;
  capture('alloc_method', 'stratified_random');

  capture('condition_groupe', condition_groupe);
  capture('condition_emo',    condition_emo);
  capture('ordre_condition',  ordre_condition);

  // ── 2. CHARGE LES SÉQUENCES ───────────────────────────────
  const csvFile = (condition_groupe === 'Frustration')
    ? 'sequences_Frustration.csv' : 'sequences_Controle.csv';
  try {
    const res  = await fetch(csvFile);
    const text = await res.text();
    sequences  = parseCSV(text).map(r => r['sequence']).filter(Boolean);
  } catch(e) {
    console.warn(csvFile + ' non trouvé — séquences de démonstration.');
    sequences = [
      '2 – 4 – 6 – 8 – 10 – 12 – 14 – ?',
      '1 – 3 – 6 – 10 – 15 – 21 – ?',
      '100 – 50 – 25 – 12.5 – ?',
      '3 – 6 – 12 – 24 – 48 – ?',
      '1 – 1 – 2 – 3 – 5 – 8 – 13 – ?',
      '81 – 27 – 9 – 3 – ?',
      '2 – 6 – 18 – 54 – 162 – ?'
    ];
  }


  // ════════════════════════════════════════════════════════════
  //  CONSTRUCTION DE LA TIMELINE
  // ════════════════════════════════════════════════════════════
  jsPsych = initJsPsych({
    on_finish: async function() {
      downloadCSV();
      document.querySelector('.jspsych-content').innerHTML =
        '<p style="color:#fff;text-align:center;margin-top:80px;font-size:1.2em;">Thank you for your patience.</p>';
    }
  });

  const tl = [];

  // ── WELCOME ──────────────────────────────────────────────────
  const welcomeScreens = [
    // welcome_1
    `<div style="max-width:820px;margin:0 auto;line-height:1.85;font-size:1.05em;text-align:center;">
      <p style="font-size:1.3em;font-weight:bold;margin-bottom:6px;">Bonjour et bienvenu.es&nbsp;!</p>
      <p>Nous vous remercions de participer à notre étude sur les émotions et comportements.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Objectif</p>
      <p>Cette étude vise à explorer certains processus psychologiques impliqués dans les ressentis émotionnels et les comportements sociaux. Elle s'inscrit dans le cadre d'un projet de recherche plus large sur le fonctionnement affectif.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Informations générales sur l'étude</p>
      <p>Cette recherche est menée dans le cadre du travail de thèse de Madame Yasmine Capela (UNIL), sous la direction de la Prof. Elise Dan-Glauser.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Déroulement de l'étude</p>
      <p>L'étude dure environ 20 minutes et se déroule exclusivement sur l'ordinateur du laboratoire LERB.</p>
      <br><br>
      <p style="font-weight:bold;">Appuyez sur ENTRÉE pour continuer.</p>
    </div>`,
    // welcome_2
    `<div style="max-width:820px;margin:0 auto;line-height:1.85;font-size:1.05em;text-align:center;">
      <p style="font-weight:bold;font-size:1.1em;">Avantages pour les participants</p>
      <p>Validation de crédits pour les étudiants. De plus, votre participation contribue à <strong>faire progresser la recherche scientifique en psychologie</strong>.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Risques et désagréments</p>
      <p>Cette étude ne comporte aucun risque pour les participants.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Confidentialité des données</p>
      <p>Toutes vos réponses sont <strong>anonymes et traitées de manière confidentielle</strong>. Aucun nom ou information personnelle ne sera associé à vos données. Celles-ci seront utilisées uniquement à des fins de recherche scientifique.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Caractère volontaire de la participation</p>
      <p>Votre participation est <strong>entièrement volontaire</strong>. Vous êtes libre de <strong>quitter l'étude à tout moment</strong>, sans devoir vous justifier. Si vous le souhaitez, vous pourrez également demander la suppression de vos données.</p>
      <br><br>
      <p style="font-weight:bold;">Appuyez sur ENTRÉE pour continuer.</p>
    </div>`
  ];

  for (const html of welcomeScreens) {
    tl.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: html,
      choices: ['Enter']
    });
  }

  // ── CONSENTEMENT ────────────────────────────────────────────
  tl.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      setContent(`
        <div style="text-align:left;font-size:0.87em;max-width:750px;margin:0 auto 20px;line-height:1.65;color:#ddd;">
          Dans le cadre d'un consentement de participation, vous acceptez les points suivants.
          Si vous ne consentez pas à une des deux affirmations, vous pouvez quitter la page.
          <br><br>
          <strong>1.</strong> L'utilisation des données à des fins scientifiques et la publication des résultats
          de la recherche dans des revues ou livres scientifiques, étant entendu que les données resteront
          anonymes et qu'aucune information ne sera donnée sur mon identité.
          <br><br>
          <strong>2.</strong> L'utilisation des données à des fins pédagogiques (cours et séminaires de
          formations d'étudiants ou de professionnels soumis au secret professionnel).
        </div>
        <button class="btn-yc3" id="consent_btn">Je consens.</button>
      `);
      document.getElementById('consent_btn').addEventListener('click', () =>
        jsPsych.finishTrial({}));
    }
  });

  // ── CODE ANONYME ────────────────────────────────────────────
  tl.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      setContent(`
        <div style="text-align:left;font-size:0.87em;max-width:720px;margin:0 auto 16px;line-height:1.65;color:#ddd;">
          Veuillez entrer votre <strong>code anonyme</strong> selon les instructions suivantes :
          <br><br>
          1. 1ère lettre du prénom de votre <strong>mère</strong> (majuscule)<br>
          2. 1ère lettre du prénom de votre <strong>père</strong> (majuscule)<br>
          3. <strong>Deux derniers chiffres</strong> de votre année de naissance<br>
          4. 1ère lettre de votre <strong>ville de naissance</strong> (majuscule)<br>
          5. <strong>Dernière lettre</strong> de votre nom de famille (minuscule)<br>
          <br>
          Exemple : Mère = Sophie, Père = Jean, né en 1994, ville = Lyon, nom = Martin
          → <strong>SJ94Ln</strong>
          <br><br>
          Écrivez ce code dans la case, puis appuyez sur <strong>ENTRÉE</strong>.
        </div>
        <input type="text" id="code_input" maxlength="6"
          style="width:210px;font-size:1.3em;text-align:center;" autocomplete="off" placeholder="SJ94Ln">
        <p id="code_err" class="error-yc3"></p>
      `);
      document.getElementById('code_input').focus();

      function onKey(e) {
        if (e.key !== 'Enter') return;
        const code = (document.getElementById('code_input').value || '').trim();
        if (/^[A-Z]{2}[0-9]{2}[A-Z][a-z]$/.test(code)) {
          document.removeEventListener('keydown', onKey);
          capture('textbox_code', code);
          jsPsych.finishTrial({});
        } else {
          document.getElementById('code_err').textContent =
            '⛔ Format invalide. Exemple attendu : SJ94Ln';
        }
      }
      document.addEventListener('keydown', onKey);
    }
  });

  // ── GENRE ───────────────────────────────────────────────────
  tl.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      setContent(`
        <p style="font-size:1.15em;margin-bottom:20px;">Choisissez votre genre :</p>
        ${['Femme','Homme','Non binaire','Ne souhaite pas répondre']
          .map(v => `<button class="btn-yc3" data-val="${v}" style="display:block;margin:8px auto;min-width:280px;">${v}</button>`)
          .join('')}
      `);
      document.querySelectorAll('.btn-yc3[data-val]').forEach(btn => {
        btn.addEventListener('click', () => {
          capture('choix_genre', btn.dataset.val);
          jsPsych.finishTrial({});
        });
      });
    }
  });

  // ── DATE DE NAISSANCE ───────────────────────────────────────
  tl.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      setContent(`
        <p style="font-size:1.1em;">Quelle est votre date de naissance ?<br>
          <span class="hint-text">(format jj.mm.aaaa)</span>
        </p>
        <input type="text" id="age_input" maxlength="10"
          style="width:220px;font-size:1.3em;text-align:center;margin-top:14px;"
          placeholder="jj.mm.aaaa" autocomplete="off">
        <p id="age_err" class="error-yc3"></p>
      `);
      document.getElementById('age_input').focus();

      function onKey(e) {
        if (e.key !== 'Enter') return;
        const raw   = (document.getElementById('age_input').value || '').trim();
        const parts = raw.split('.');
        if (parts.length === 3) {
          const [j, m, a] = parts;
          if (/^\d{2}$/.test(j) && parseInt(j) >= 1 && parseInt(j) <= 31 &&
              /^\d{2}$/.test(m) && parseInt(m) >= 1 && parseInt(m) <= 12 &&
              /^\d{4}$/.test(a)) {
            document.removeEventListener('keydown', onKey);
            capture('date_naissance', raw);
            jsPsych.finishTrial({});
            return;
          }
        }
        document.getElementById('age_err').textContent =
          '❌ Format invalide. Utilisez : jj.mm.aaaa';
      }
      document.addEventListener('keydown', onKey);
    }
  });

  // ────────────────────────────────────────────────────────────
  //  ÉVALUATION AFFECTIVE BASELINE
  // ────────────────────────────────────────────────────────────
  tl.push(aff_consigne);
  tl.push(makeAffectAllTrial('emotion', 'affect_rating', false));
  tl.push(makeDatAllTrial('dat_images', 'slider_dat1_rating'));
  tl.push(makeSitControleTrial('t1'));

  // ══════════════════════════════════════════════════════════════
  //  BRANCHE A  —  COLÈRE D'ABORD
  // ══════════════════════════════════════════════════════════════
  const isColere = () => ordre_condition === 'colere_dabord';

  // Consigne tâche nombres
  tl.push({
    timeline: [enterScreen(`
      <p style="font-size:0.88em;color:#ddd;max-width:750px;margin:0 auto;text-align:left;line-height:1.65;">
        Dans cette tâche, vous allez voir des <strong>suites de chiffres</strong>.<br><br>
        Chaque suite suit une règle logique. Votre objectif est de la découvrir et de compléter
        la suite avec le bon chiffre.<br><br>
        Exemple : 2 – 4 – 6 – 8 – 10 – 12 – 14 – ?<br>
        Solution : La règle est d'ajouter 2. La réponse est <strong>16</strong>.<br>
        Tapez "16" puis appuyez sur ENTRÉE pour passer à la suite.<br><br>
        Appuyez sur <strong>ENTRÉE</strong> pour commencer.
      </p>
    `)],
    conditional_function: isColere
  });

  // Séquences colère
  _angerTrialIndex = 0;  // reset compteur pour ce bloc
  sequences.forEach(seq => {
    tl.push({ timeline: [makeAngerTrial(seq, ANGER_RTs)], conditional_function: isColere });
  });

  // Affect 2 — post-colère
  tl.push({ timeline: [aff_consigne], conditional_function: isColere });
  tl.push({ timeline: [makeAffectAllTrial('emotion2', 'affect2_rating', true)], conditional_function: isColere });
  tl.push({ timeline: [makeDatAllTrial('dat2_images', 'slider_dat2_rating')], conditional_function: isColere });
  tl.push({ timeline: [makeSitControleTrial('t2')], conditional_function: isColere });

  // Induction émotionnelle
  tl.push({ timeline: [makeEmoInduction()], conditional_function: isColere });

  // Affect 3 — post-emo
  tl.push({ timeline: [aff_consigne], conditional_function: isColere });
  tl.push({ timeline: [makeAffectAllTrial('emotion3', 'affect3_rating', true)], conditional_function: isColere });
  tl.push({ timeline: [makeDatAllTrial('dat3_images', 'slider_dat3_rating')], conditional_function: isColere });
  tl.push({ timeline: [makeSitControleTrial('t3')], conditional_function: isColere });

  // ══════════════════════════════════════════════════════════════
  //  BRANCHE B  —  TRISTESSE D'ABORD
  // ══════════════════════════════════════════════════════════════
  const isTristesse = () => ordre_condition === 'tristesse_dabord';

  // Induction émotionnelle
  tl.push({ timeline: [makeEmoInduction()], conditional_function: isTristesse });

  // Affect 2 — post-emo
  tl.push({ timeline: [aff_consigne], conditional_function: isTristesse });
  tl.push({ timeline: [makeAffectAllTrial('emotion2_bis', 'affect2_bis_rating', true)], conditional_function: isTristesse });
  tl.push({ timeline: [makeDatAllTrial('dat4_images', 'slider_dat4_rating')], conditional_function: isTristesse });
  tl.push({ timeline: [makeSitControleTrial('t4')], conditional_function: isTristesse });

  // Consigne tâche nombres (bis)
  tl.push({
    timeline: [enterScreen(`
      <p style="font-size:0.88em;color:#ddd;max-width:750px;margin:0 auto;text-align:left;line-height:1.65;">
        Vous allez maintenant voir des suites de chiffres.<br><br>
        Exemple : 2 – 4 – 6 – 8 – 10 – 12 – 14 – ?  →  Réponse : <strong>16</strong><br><br>
        Appuyez sur <strong>ENTRÉE</strong> pour commencer.
      </p>
    `)],
    conditional_function: isTristesse
  });

  // Séquences colère (bis)
  _angerTrialIndex = 0;  // reset compteur pour ce bloc bis
  sequences.forEach(seq => {
    tl.push({ timeline: [makeAngerTrial(seq, ANGER_RTs_BIS)], conditional_function: isTristesse });
  });

  // Affect 3 — post-colère
  tl.push({ timeline: [aff_consigne], conditional_function: isTristesse });
  tl.push({ timeline: [makeAffectAllTrial('emotion3_bis', 'affect3_bis_rating', true)], conditional_function: isTristesse });
  tl.push({ timeline: [makeDatAllTrial('dat5_images', 'slider_dat5_rating')], conditional_function: isTristesse });
  tl.push({ timeline: [makeSitControleTrial('t5')], conditional_function: isTristesse });

  // ══════════════════════════════════════════════════════════════
  //  MESURE COMPORTEMENT AGRESSIF (cover story)
  // ══════════════════════════════════════════════════════════════
  tl.push(enterScreen(`
    <p style="font-size:0.88em;color:#ddd;max-width:750px;margin:0 auto;text-align:left;line-height:1.7;">
      Avant de terminer, vous allez contribuer à la suite de cette étude.<br><br>
      Afin d'éviter les biais liés à l'expérimentateur, chaque participant choisit la difficulté des séquences
      que devra résoudre un prochain participant.<br><br>
      Vous devez répartir un total de <strong>7</strong> suites entre trois niveaux :
      <strong>Facile — Moyen — Difficile</strong><br><br>
      Appuyez sur <strong>ENTRÉE</strong> pour continuer.
    </p>
  `));

  tl.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '', choices: 'NO_KEYS',
    on_load() {
      setContent(`
        <p style="font-size:0.95em;margin-bottom:20px;">
          Répartissez un total de <strong>7</strong> suites entre les trois niveaux :
        </p>
        <div style="display:flex;justify-content:center;gap:50px;flex-wrap:wrap;">
          ${[['agg_easy','Facile'],['agg_med','Moyen'],['agg_hard','Difficile']].map(([id,lbl]) => `
            <div>
              <p style="margin-bottom:6px;">${lbl}</p>
              <input type="text" id="${id}" maxlength="1"
                style="width:70px;font-size:1.4em;text-align:center;" autocomplete="off">
            </div>
          `).join('')}
        </div>
        <p id="agg_err" class="error-yc3" style="margin-top:14px;"></p>
        <p class="hint-text">Appuyez sur <strong>ENTRÉE</strong> pour valider.</p>
      `);
      document.getElementById('agg_easy').focus();

      function onKey(e) {
        if (e.key !== 'Enter') return;
        const f = parseInt(document.getElementById('agg_easy').value.trim());
        const m = parseInt(document.getElementById('agg_med').value.trim());
        const h = parseInt(document.getElementById('agg_hard').value.trim());
        if ([f,m,h].some(v => isNaN(v) || v < 0 || v > 7)) {
          document.getElementById('agg_err').textContent = 'Chiffres entre 0 et 7 uniquement.';
          return;
        }
        if (f + m + h !== 7) {
          document.getElementById('agg_err').textContent = 'La somme des trois valeurs doit faire 7.';
          return;
        }
        document.removeEventListener('keydown', onKey);
        capture('agg_facile', f); capture('agg_moyen', m); capture('agg_difficile', h);
        jsPsych.finishTrial({});
      }
      document.addEventListener('keydown', onKey);
    }
  });

  // ── DÉBRIEF ────────────────────────────────────────────────
  const debriefScreens = [
    // debrief_1
    `<div style="max-width:820px;margin:0 auto;line-height:1.85;font-size:1.0em;text-align:center;">
      <p style="font-weight:bold;font-size:1.15em;">Debriefing de l'étude</p>
      <p>Nous vous remercions sincèrement pour le temps consacré à cette étude et vous proposons un débriefing détaillé afin de répondre à toute question que vous pourriez avoir.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Objectifs et Hypothèses</p>
      <p>L'objectif principal de cette étude était d'examiner l'impact de certaines émotions, en particulier la colère et la tristesse, sur les comportements et ressentis qui en découlent. Plus précisément, nous cherchions à comprendre dans quelle mesure une émotion négative, induite par une tâche spécifique (comme une tâche de suite de chiffres difficile ou la remémoration d'un souvenir personnel triste), pouvait influencer l'intensité de certaines émotions ressenties (colère, tristesse, émotions positives) et affecter certains comportements interpersonnels (comme l'attribution d'une tâche difficile à autrui).</p>
      <br>
      <p>Nous faisions l'hypothèse que les émotions induites influenceraient les réactions affectives des participant·e·s ainsi que leur comportement à l'égard d'une autre personne (comportement agressif ou non).</p>
      <br><br>
      <p style="font-weight:bold;">Appuyez sur ENTRÉE pour voir la suite.</p>
    </div>`,
    // debrief_2
    `<div style="max-width:820px;margin:0 auto;line-height:1.85;font-size:1.0em;text-align:center;">
      <p style="font-weight:bold;font-size:1.1em;">Méthodes et Procédures</p>
      <p><u>Pour cela, nous avons utilisé deux types de tâches émotionnelles&nbsp;:</u></p>
      <br>
      <p style="text-align:left;"><strong>Une tâche de suites de chiffres</strong>&nbsp;: selon les cas, vous avez été exposé·e soit à des suites très faciles (condition contrôle), soit à des suites volontairement frustrantes et insolubles (condition colère), avec ou sans limite de temps.</p>
      <br>
      <p style="text-align:left;"><strong>Une tâche de remémoration d'un événement personnel</strong>&nbsp;: selon les cas, vous deviez décrire un souvenir triste ou une situation totalement neutre.</p>
      <br>
      <p>Par la suite, votre ressenti émotionnel était évalué, puis une tâche finale vous demandait d'attribuer des suites de chiffres à un·e autre participant·e fictif·ve. Cette tâche nous permettait d'évaluer, de façon indirecte, la propension à adopter un comportement agressif après avoir vécu certaines émotions.</p>
      <br>
      <p style="font-weight:bold;font-size:1.05em;">Espace de discussion &amp; droit au retrait des données</p>
      <p>Maintenant que vous avez pris connaissance des objectifs de cette étude, vous êtes libre de poser toutes vos questions ou d'exprimer un inconfort. Il vous suffit de nous écrire aux adresses ci-dessous.</p>
      <br>
      <p>De plus, si vous n'êtes pas à l'aise avec votre participation à la lumière de ces explications, vous avez le droit de demander le retrait de vos données. Dans ce cas, il vous suffit de nous contacter par mail en nous précisant votre date de naissance. Vos données seront alors supprimées, conformément à notre politique de confidentialité.</p>
      <br><br>
      <p style="font-weight:bold;">Appuyez sur ENTRÉE pour voir la suite.</p>
    </div>`,
    // debrief_3
    `<div style="max-width:820px;margin:0 auto;line-height:1.85;font-size:1.05em;text-align:center;">
      <p style="font-weight:bold;font-size:1.1em;">Suivi</p>
      <p>Si vous souhaitez être informé·e des résultats globaux de cette recherche ou de ses suites, n'hésitez pas à nous contacter.</p>
      <br>
      <p style="font-weight:bold;font-size:1.1em;">Contacts</p>
      <p><a href="mailto:yasmine.capelaabdalla@unil.ch" style="color:#adf;">yasmine.capelaabdalla@unil.ch</a></p>
      <p><a href="mailto:elise.danglauser@unil.ch" style="color:#adf;">elise.danglauser@unil.ch</a></p>
      <br><br>
      <p style="font-weight:bold;">Appuyez sur ENTRÉE pour terminer l'expérience.</p>
    </div>`
  ];

  for (const html of debriefScreens) {
    tl.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: html,
      choices: ['Enter']
    });
  }

  // ── LANCE ──────────────────────────────────────────────────
  await jsPsych.run(tl);
}

runExperiment().catch(console.error);
</script>
